app = "turnostyle-backend"
primary_region = "gru"

[build]

[env]
  PORT = "3001"
  NODE_ENV = "production"
  DB_PATH = "/data/barbershop.db"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "data"
  destination = "/data"
